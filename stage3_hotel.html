}
.leftRig{left:5%;transform:rotate(3deg)}
.rightRig{right:5%;transform:rotate(-3deg)}

.cable{
  position:absolute;width:12%;height:90%;bottom:-34%;left:44%;
  border-radius:7px;opacity:.95;
  box-shadow:inset 0 0 5px rgba(255,255,255,.12),0 6px 15px rgba(0,0,0,.5);

.wristUnit{
  position:absolute;left:30%;bottom:7%;width:42%;height:25%;
  background:linear-gradient(180deg,#41494b,#181d1e 58%,#0b0e0f);

}

.glove{position:absolute;left:7%;top:-1%;width:86%;height:74%}

  position:absolute;left:20%;top:39%;width:61%;height:42%;
  border-radius:9px 9px 15px 15px;
  clip-path:polygon(4% 0,96% 0,100% 15%,95% 100%,7% 100%,0 15%);
  box-shadow:inset 5px 6px 8px rgba(255,255,255,.13),
             inset -7px -8px 10px rgba(0,0,0,.24),
             0 8px 15px rgba(0,0,0,.3);
}
.palmPad{
  position:absolute;left:30%;top:35%;width:40%;height:31%;
  border-radius:6px;box-shadow:inset 0 0 7px rgba(0,0,0,.18);
}

  position:absolute;display:block;border-radius:8px 8px 4px 4px;
  box-shadow:inset 3px 3px 5px rgba(255,255,255,.14),

.pinky{width:13%;height:35%;left:71%;top:7%;transform:rotate(4deg)}

function endingFade(t,a,b){

 const q=(t-a)/(b-a);return q*q*(3-2*q);
}

     const paths=[
       {base:.47, slope:-.34, amp:.055, freq:8.7, phase:.4,  min:-.94,max:.18,w:.018},

       {base:.60, slope: .08, amp:.060, freq:11.6,phase:.9, min:.28,max:.88,w:.011}

     for(const q of paths){

 // Ver.6c: lettering is projected from fixed coordinates ON the lobby back wall.
 // The panel/counter themselves are ray-integrated above; this helper only prints the letters
 // at the same wall depth and disappears automatically when that wall is not visible.
 function lobbyWallProjection(wx,wy=13.98){
   const dx=wx-player.x,dy=wy-player.y,d=Math.hypot(dx,dy);
   if(d<.2||d>18)return null;
   const rel=norm(Math.atan2(dy,dx)-player.dir);
   if(Math.abs(rel)>FOV*.50)return null;
   const ca=Math.cos(player.dir+rel),sa=Math.sin(player.dir+rel);
   // Require this exact lobby wall to be the first wall encountered.
   let rd=.04, first=null;
   while(rd<d+.35){
     const rx=player.x+ca*rd, ry=player.y+sa*rd;
     if(wallAt(rx,ry)){first={x:rx,y:ry,d:rd};break;}
     rd+=.025;

 // Visible hotel light fixtures. Each fixture performs a depth check against the wall
 // in its screen direction; if a wall is closer, the fixture is not drawn.
 function fixtureVisible(wx,wy){
   const dx=wx-player.x,dy=wy-player.y;
   const d=Math.hypot(dx,dy);
   const rel=norm(Math.atan2(dy,dx)-player.dir);
   if(Math.abs(rel)>FOV*.56 || d<.15 || d>15)return null;

   // Ray-test to fixture. A wall before the fixture means complete occlusion.
   const ca=Math.cos(player.dir+rel),sa=Math.sin(player.dir+rel);
   let rd=.05;
   while(rd<d){
     if(wallAt(player.x+ca*rd,player.y+sa*rd))return null;
     rd+=.035;
   }
   const sx=W/2+(rel/(FOV/2))*W/2;
   return {sx,d};
 }

 if(!d || floor!==1)return false;
 const x=player.x,y=player.y;
 if(room===201) return x>2.65&&x<4.35 && y>3.12&&y<4.65;
 if(room===203) return x>9.55&&x<11.02 && y>3.65&&y<5.35;
 if(room===209) return x>14.65&&x<16.35 && y>8.05&&y<9.65;
 if(room===214) return x>14.65&&x<16.35 && y>10.45&&y<11.95;
 if(room===218) return x>10.65&&x<12.35 && y>15.35&&y<16.88;
 return false;
}

function draw201DoorPrompt(){
 if(floor!==1||inRoom201||inRoom218||inRoom209||inRoom203||inRoom214)return;
 const d=GUEST_DOORS.find(q=>q[2]===201);
 if(!d)return;
 if(guestDoorFrontSide(201) && Math.hypot(player.x-d[0],player.y-d[1])<2.35){
   const W=canvas.width,H=canvas.height;
   ctx.fillStyle="rgba(12,16,19,.78)";ctx.fillRect(W/2-150,H*.70-25,300,45);
   ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="700 18px system-ui";
   ctx.fillText("E：ROOM 201 に入る",W/2,H*.70+4);
 }
}

function loop(ts){
 if(!running)return;
 const dt=Math.min(.04,(ts-last)/1000||0);last=ts;
 update(dt);draw();requestAnimationFrame(loop);
}
addEventListener("keydown",e=>{
 if(!keypadOpen)return;
 if(/^Digit[0-9]$/.test(e.code)){pressSecurityKey(e.code.slice(-1));e.preventDefault();e.stopImmediatePropagation();return}
 if(/^Numpad[0-9]$/.test(e.code)){pressSecurityKey(e.code.slice(-1));e.preventDefault();e.stopImmediatePropagation();return}
 if(e.code==="Backspace"){pressSecurityKey("B");e.preventDefault();e.stopImmediatePropagation();return}
 if(e.code==="Delete"){pressSecurityKey("C");e.preventDefault();e.stopImmediatePropagation();return}
 if(e.code==="Enter"){submitSecurityCode();e.preventDefault();e.stopImmediatePropagation();return}
 if(e.code==="Escape"){closeSecurityKeypad();e.preventDefault();e.stopImmediatePropagation();return}
 e.stopImmediatePropagation();
},true);
addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>keys[e.code]=false);

// Ver.1.5.6 — touch input is connected inside the hotel game closure.
// This avoids synthetic keyboard/pointer-lock behavior on phones.
document.addEventListener("hotel-mobile-move",e=>{
 const d=e.detail||{},f=Number(d.f)||0,r=Number(d.strafe)||0;
 keys.KeyW=f>.12;keys.KeyS=f<-.12;keys.KeyD=r>.12;keys.KeyA=r<-.12;
});
document.addEventListener("hotel-mobile-run",e=>{keys.ShiftLeft=!!(e.detail&&e.detail.on)});
document.addEventListener("hotel-mobile-interact",()=>{if(running&&!keypadOpen)interact()});
document.addEventListener("hotel-mobile-look",e=>{
 if(!running||keypadOpen)return;
 const dx=Number(e.detail&&e.detail.dx)||0;
 if(inRoom201)roomPlayer201.dir+=dx*.003;
 else if(inRoom218)roomPlayer218.dir+=dx*.003;
 else if(inRoom209)roomPlayer209.dir+=dx*.003;
 else if(inRoom203)roomPlayer203.dir+=dx*.003;
 else if(inRoom214)roomPlayer.dir+=dx*.003;
 else player.dir+=dx*.003;
});
canvas.addEventListener("click",()=>{if(running&&!hotelTouchMobile)canvas.requestPointerLock()});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===canvas){if(inRoom201)roomPlayer201.dir+=e.movementX*.00235;else if(inRoom218)roomPlayer218.dir+=e.movementX*.00235;else if(inRoom209)roomPlayer209.dir+=e.movementX*.00235;else if(inRoom203)roomPlayer203.dir+=e.movementX*.00235;else if(inRoom214)roomPlayer.dir+=e.movementX*.00235;else player.dir+=e.movementX*.00235;}
});
startBtn.addEventListener("click",()=>{
 start.style.display="none";running=true;last=performance.now();
 if(!hotelTouchMobile)canvas.requestPointerLock();
 showMessage("1F — HOTEL LOBBY",1300);requestAnimationFrame(loop);
});
floorName.textContent=FLOOR_NAMES[floor];
document.getElementById("monsterRetry").addEventListener("click",()=>location.reload());
draw();
</script>
<div id="mobileControls" aria-hidden="true"><div id="mcLook" class="mc-look"></div><div id="mcStick" class="mc-stick"><div id="mcKnob" class="mc-knob"></div></div><button id="mcRun" class="mc-run" type="button">RUN</button><button id="mcE" class="mc-e" type="button">E<span>調べる</span></button></div><script>
(()=>{
 const mobile=matchMedia("(hover:none) and (pointer:coarse)").matches||navigator.maxTouchPoints>0;if(!mobile)return;
 const stick=document.getElementById("mcStick"),knob=document.getElementById("mcKnob"),look=document.getElementById("mcLook"),eb=document.getElementById("mcE"),run=document.getElementById("mcRun");
 const send=(name,detail={})=>document.dispatchEvent(new CustomEvent(name,{detail}));
 function clear(){send("hotel-mobile-move",{f:0,strafe:0});knob.style.transform="translate(0,0)"}
 let sid=null,cx=0,cy=0;
 function sm(x,y){
   let dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1,m=47;
   if(d>m){dx*=m/d;dy*=m/d}
   knob.style.transform=`translate(${dx}px,${dy}px)`;
   const q=8;
   send("hotel-mobile-move",{f:Math.abs(dy)>q?-dy/m:0,strafe:Math.abs(dx)>q?dx/m:0});
 }
 stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);let r=stick.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;sm(e.clientX,e.clientY);e.preventDefault();e.stopPropagation()};
 stick.onpointermove=e=>{if(e.pointerId===sid){sm(e.clientX,e.clientY);e.preventDefault()}};
 stick.onpointerup=stick.onpointercancel=e=>{if(sid===null||e.pointerId===sid){sid=null;clear();e.preventDefault()}};
 let lid=null,lx=0;
 look.onpointerdown=e=>{lid=e.pointerId;lx=e.clientX;look.setPointerCapture(lid);e.preventDefault()};
 look.onpointermove=e=>{if(e.pointerId!==lid)return;let dx=e.clientX-lx;lx=e.clientX;send("hotel-mobile-look",{dx});e.preventDefault()};
 look.onpointerup=look.onpointercancel=e=>{if(lid===null||e.pointerId===lid){lid=null;e.preventDefault()}};
 eb.onpointerdown=e=>{e.preventDefault();e.stopPropagation();send("hotel-mobile-interact")};
 let fast=false;
 run.onpointerdown=e=>{e.preventDefault();e.stopPropagation();fast=!fast;send("hotel-mobile-run",{on:fast});run.style.background=fast?"rgba(255,255,255,.34)":"rgba(18,22,28,.48)"};
 window.addEventListener("blur",()=>{clear();if(fast){fast=false;send("hotel-mobile-run",{on:false})}});
})();
</script></body>
